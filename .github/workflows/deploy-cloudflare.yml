# نشر آمن إلى Cloudflare — التوكن يبقى داخل GitHub ولا يُطبع أبدًا.
# التشغيل يدوي فقط (workflow_dispatch) حتى نعرف بنية المشروع الأول.
name: Deploy → Cloudflare

on:
  workflow_dispatch:
    inputs:
      target:
        description: "ماذا ننشر؟"
        required: true
        default: pages
        type: choice
        options: [pages, worker]
      project:
        description: "اسم مشروع Cloudflare (Pages project name أو Worker name)"
        required: true
        type: string
      directory:
        description: "مجلد النشر (للـ Pages)"
        required: false
        default: dist
        type: string
      dry_run:
        description: "تجربة بدون نشر فعلي (بناء فقط)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-cloudflare-${{ github.event.inputs.project }}
  cancel-in-progress: false

jobs:
  preflight:
    name: فحص المتطلبات (بدون طباعة أي سر)
    runs-on: ubuntu-latest
    steps:
      - name: التحقق من وجود الأسرار
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          missing=0
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::السر CLOUDFLARE_API_TOKEN غير موجود في هذا المستودع."
            missing=1
          fi
          if [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::السر CLOUDFLARE_ACCOUNT_ID غير موجود في هذا المستودع."
            missing=1
          fi
          [ "$missing" -eq 0 ] && echo "✅ الأسرار موجودة (القيم لم تُقرأ ولم تُطبع)."
          exit "$missing"

  deploy:
    name: نشر ${{ github.event.inputs.target }}
    needs: preflight
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.out.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: تثبيت الاعتماديات
        run: npm ci --no-audit --no-fund

      - name: بناء (إن وُجد سكربت build)
        run: npm run build --if-present

      - name: نشر إلى Cloudflare Pages
        if: ${{ github.event.inputs.target == 'pages' && github.event.inputs.dry_run == 'false' }}
        id: pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy ${{ github.event.inputs.directory }}
            --project-name=${{ github.event.inputs.project }}
            --branch=${{ github.ref_name }}

      - name: نشر Worker
        if: ${{ github.event.inputs.target == 'worker' && github.event.inputs.dry_run == 'false' }}
        id: worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: تحديد الرابط الناتج
        id: out
        env:
          PAGES_URL: ${{ steps.pages.outputs.deployment-url }}
          WRANGLER_OUT: ${{ steps.worker.outputs.command-output }}
        run: |
          url="${PAGES_URL}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          if [ -n "$url" ]; then echo "### ✅ تم النشر: $url" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: ملاحظة تجربة جافة
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "🧪 Dry run — تم البناء فقط، بدون نشر." >> "$GITHUB_STEP_SUMMARY"
